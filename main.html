<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Campfire Club registration page">
    <title>Campfire Club | Registration</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/app.js" defer></script>
  </head>
  <body data-page="register" data-root>
    <div id="site-header"></div>
    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">Campfire Club</p>
          <h1>Join the Campfire Club.</h1>
          <p class="intro">Create an account to join the community. Your data is saved only in this browser.</p>
        </div>
        <section class="form-card" aria-labelledby="register-title">
          <p class="eyebrow">New member</p>
          <h2 id="register-title">Registration</h2>
          <form id="registration-form">
            <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" minlength="2" required></div>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
            <button class="primary-button" type="submit">Register</button>
            <p class="form-message" id="form-message" aria-live="polite"></p>
          </form>
          <p class="form-note">Already registered? <a class="form-link" href="pages/login.html">Log in</a></p>
        </section>
      </section>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
