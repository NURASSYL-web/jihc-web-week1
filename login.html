<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campfire Club | Log in</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/app.js" defer></script>
  </head>
  <body data-page="login">
    <div id="site-header"></div>
    <main>
      <section class="page-heading"><p class="eyebrow">Member access</p><h1>Welcome back.</h1><p>Enter the email and password you used during registration.</p></section>
      <section class="form-card" aria-labelledby="login-title">
        <h2 id="login-title">Log in</h2>
        <form id="login-form">
          <div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
          <button class="primary-button" type="submit">Log in</button>
          <p class="form-message" id="login-message" aria-live="polite"></p>
        </form>
        <p class="form-note">Do not have an account? <a class="form-link" href="../main.html">Register</a></p>
      </section>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
